[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-strf"
version = "0.1.0"
description = "Leakage-safe STRF encoding analysis for speech-model representations"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.11",
  "librosa>=0.11",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "soundfile>=0.12",
  "torch>=2.3",
  "transformers>=4.44",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

